<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>退室時間のご案内</title>
</head>
<body style="background-color: #fcf8f2; margin: 0; padding: 10px; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;">

<div style="max-width: 450px; margin: 20px auto; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); background-color: #ffffff; color: #4a4a4a; box-sizing: border-box; border: 1px solid #f0e6d2;">
    <h2 style="text-align: center; color: #6b4c35; font-size: 1.4rem; margin-top: 0; margin-bottom: 20px;">退室時間・料金のご案内</h2>
    
    <!-- マナーモード解除のお願い ＆ テストボタン -->
    <div style="background-color: #fff9e6; color: #8a6d3b; padding: 12px 15px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px; text-align: center; border: 1px dashed #f0c36d;">
        <div style="margin-bottom: 8px;">🔔 お知らせ音を鳴らすため、マナーモード（サイレント）の解除をお願いいたします</div>
        <button type="button" id="testSoundBtn" style="background-color: #f39c12; color: #ffffff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(243,156,18,0.3);">
            🔊 お知らせ音テスト（タップして確認）
        </button>
    </div>

    <!-- スタート時間設定 -->
    <div style="margin-bottom: 15px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; color: #6b4c35;">入室時間（スタート時間）</label>
        <input type="time" id="startTime" style="width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #e0d0b8; border-radius: 8px; box-sizing: border-box; background-color: #faf8f5;">
    </div>

    <!-- プラン選択 -->
    <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; color: #6b4c35;">ご利用プラン</label>
        <select id="planSelect" style="width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #e0d0b8; border-radius: 8px; box-sizing: border-box; background-color: #faf8f5;">
            <option value="30|165">ショートプラン：最初30分 (165円)</option>
            <option value="60|275">1時間 (275円)</option>
            <option value="120|495">2時間 (495円)</option>
            <option value="180|550">ステイプラン：3時間 (550円)</option>
            <option value="210|660">3時間半 (660円)</option>
            <option value="240|770">4時間 (770円)</option>
            <option value="241|880">1day（4時間超） (880円)</option>
        </select>
    </div>

    <!-- 計算実行ボタン -->
    <button type="button" id="calcBtn" style="width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; color: #ffffff; background-color: #e67e22; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(230,126,34,0.3);">
        計算・タイマー開始
    </button>

    <!-- 結果表示エリア -->
    <div id="resultArea" style="display: none; margin-top: 25px; padding-top: 20px; border-top: 2px dashed #f0e6d2; text-align: center;">
        <div style="margin-bottom: 10px;">
            <span style="font-size: 0.9rem; color: #888;">退室予定時刻</span>
            <div id="checkoutTime" style="font-size: 2.3rem; font-weight: bold; color: #d35400;">--:--</div>
        </div>

        <div style="margin-bottom: 15px;">
            <span style="font-size: 0.9rem; color: #888;">概算ご利用料金（税込）</span>
            <div id="totalPrice" style="font-size: 1.5rem; font-weight: bold; color: #4a4a4a;">--円</div>
        </div>

        <!-- カウントダウンタイマー -->
        <div style="background-color: #faf8f5; padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px solid #f0e6d2;">
            <span style="font-size: 0.85rem; color: #888;">退室までの残り時間</span>
            <div id="timerDisplay" style="font-size: 2.2rem; font-weight: bold; color: #27ae60; margin-top: 5px;">--分--秒</div>
            <div id="alertNotice" style="font-size: 0.95rem; color: #e67e22; margin-top: 5px; font-weight: bold; display: none;">
                ☕️ まもなくお時間です
            </div>
        </div>
    </div>
</div>

<!-- アラーム・テスト共有全画面モーダル (初期非表示) -->
<div id="alarmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 252, 248, 0.95); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; color: #4a4a4a; padding: 20px; box-sizing: border-box; text-align: center;">
    <div id="alarmModalIcon" style="font-size: 3.5rem; margin-bottom: 10px;">🔊</div>
    <div id="alarmModalTitle" style="font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; color: #6b4c35;">
        音のテスト中
    </div>
    <div id="alarmModalMessage" style="font-size: 1rem; margin-bottom: 30px; color: #666; line-height: 1.5;">
        テスト音が鳴っています。<br>聞こえる程度まで端末の音量を上げてください。
    </div>
    <button type="button" id="stopBtn" style="width: 80%; max-width: 280px; padding: 16px; font-size: 1.1rem; font-weight: bold; color: #ffffff; background-color: #e67e22; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 12px rgba(230,126,34,0.3);">
        テストを終了する
    </button>
</div>

<script>
(function() {
    let audioCtx = null;
    let alarmTimerInterval = null;

    // チャイム音再生関数
    function playChime(type) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (alarmTimerInterval) clearInterval(alarmTimerInterval);

            const notes = type === '10min' 
                ? [261.63, 523.25, 659.25, 783.99] // ド・ド・ミ・ソ
                : [329.63, 659.25, 783.99, 1046.50]; // ミ・ミ・ソ・ド

            function playSound() {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                notes.forEach((freq, index) => {
                    const startTime = audioCtx.currentTime + (index * 0.12);
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle'; 
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(1.0, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.9);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.9);
                });

                if ('vibrate' in navigator) {
                    navigator.vibrate([200, 100, 200]);
                }
            }

            playSound();
            alarmTimerInterval = setInterval(playSound, 2000);

        } catch(e) {
            console.log("Audio not allowed", e);
        }
    }

    function stopAlarmLoop() {
        if (alarmTimerInterval) {
            clearInterval(alarmTimerInterval);
            alarmTimerInterval = null;
        }
    }

    function showAlarmModal(type) {
        const modal = document.getElementById('alarmModal');
        const icon = document.getElementById('alarmModalIcon');
        const title = document.getElementById('alarmModalTitle');
        const message = document.getElementById('alarmModalMessage');
        const stopBtn = document.getElementById('stopBtn');

        if (type === 'test') {
            icon.innerText = '🔊';
            title.innerText = '音のテスト中';
            message.innerHTML = 'テスト音が鳴っています。<br><strong style="color:#d35400;">しっかり聞こえる程度まで端末の音量を上げてください。</strong>';
            stopBtn.innerText = 'テストを終了する';
            playChime('10min');
        } else if (type === '10min') {
            icon.innerText = '☕️';
            title.innerText = 'まもなくお時間です';
            message.innerHTML = '終了10分前になりました。<br>お忘れ物のないよう、少しずつご準備をおすすめいたします。';
            stopBtn.innerText = 'お知らせを止める';
            playChime('10min');
        } else {
            icon.innerText = '✨';
            title.innerText = 'ご利用ありがとうございました';
            message.innerHTML = '予定の退室時間となりました。<br>本日のご来店、誠にありがとうございました。';
            stopBtn.innerText = 'お知らせを止める';
            playChime('end');
        }
        modal.style.display = 'flex';
    }

    // テストボタン動作
    document.getElementById('testSoundBtn').onclick = function() {
        showAlarmModal('test');
    };

    // モーダル閉じるボタン動作
    document.getElementById('stopBtn').onclick = function() {
        document.getElementById('alarmModal').style.display = 'none';
        stopAlarmLoop();
    };

    function initTimerApp() {
        const startTimeInput = document.getElementById('startTime');
        const calcBtn = document.getElementById('calcBtn');
        if (!startTimeInput || !calcBtn) return;

        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        startTimeInput.value = hours + ':' + minutes;

        let timerInterval = null;
        let hasAlerted10Min = false;
        let hasAlertedEnd = false;

        calcBtn.onclick = function() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const startTimeValue = startTimeInput.value;
            if (!startTimeValue) {
                alert('入室時間を設定してください。');
                return;
            }

            const planVal = document.getElementById('planSelect').value.split('|');
            const selectedMinutes = parseInt(planVal[0], 10);
            const price = parseInt(planVal[1], 10);

            const timeParts = startTimeValue.split(':');
            const startHours = parseInt(timeParts[0], 10);
            const startMins = parseInt(timeParts[1], 10);

            const nowDate = new Date();
            const startDateTime = new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate(), startHours, startMins, 0);
            const checkoutDateTime = new Date(startDateTime.getTime() + selectedMinutes * 60000);

            const endHours = String(checkoutDateTime.getHours()).padStart(2, '0');
            const endMins = String(checkoutDateTime.getMinutes()).padStart(2, '0');
            
            document.getElementById('checkoutTime').innerText = endHours + ':' + endMins;
            document.getElementById('totalPrice').innerText = price.toLocaleString() + '円';
            document.getElementById('resultArea').style.display = 'block';

            if (timerInterval) clearInterval(timerInterval);
            hasAlerted10Min = false;
            hasAlertedEnd = false;

            function updateTimer() {
                const current = new Date();
                const diffMs = checkoutDateTime - current;

                const timerDisplay = document.getElementById('timerDisplay');
                const alertNotice = document.getElementById('alertNotice');

                if (diffMs <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "お時間となりました";
                    timerDisplay.style.color = "#e67e22";
                    alertNotice.style.display = "none";

                    if (!hasAlertedEnd) {
                        hasAlertedEnd = true;
                        showAlarmModal('end');
                    }
                    return;
                }

                const totalSeconds = Math.floor(diffMs / 1000);
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;

                timerDisplay.innerText = mins + '分' + String(secs).padStart(2, '0') + '秒';

                if (totalSeconds <= 600) {
                    timerDisplay.style.color = "#e67e22";
                    alertNotice.style.display = "block";

                    if (!hasAlerted10Min) {
                        hasAlerted10Min = true;
                        showAlarmModal('10min');
                    }
                } else {
                    timerDisplay.style.color = "#27ae60";
                    alertNotice.style.display = "none";
                }
            }

            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        };
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTimerApp);
    } else {
        initTimerApp();
    }
})();
</script>

</body>
</html>
